name: 🎌 Anime Database Update

on:
  # Günde 2 kere otomatik çalış (00:00 ve 12:00 UTC)
  schedule:
    - cron: '0 0,12 * * *'

  # GitHub üzerinden tek tıkla manuel çalıştırma
  workflow_dispatch:
    inputs:
      full_scrape:
        description: 'Tüm kataloğu baştan/kaldığı yerden çek (--full)'
        required: false
        type: boolean
        default: false
      workers:
        description: 'Paralel Worker Sayısı (Önerilen: 2-3)'
        required: false
        type: string
        default: '2'
      max_hours:
        description: 'Maksimum Çalışma Süresi (Saat)'
        required: false
        type: string
        default: '5.5'

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 saat (GitHub Actions maksimum runner sınırı)

    steps:
      # 1. Repo'yu checkout et
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Python kur
      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Bağımlılıkları yükle
      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # 4. AnimeciX güncelleme scriptini çalıştır
      - name: 🔄 Run Database Update (AnimeciX)
        id: run_update
        run: |
          WORKERS="${{ github.event.inputs.workers || '2' }}"
          MAX_HOURS="${{ github.event.inputs.max_hours || '5.5' }}"
          FULL="${{ github.event.inputs.full_scrape || 'false' }}"

          echo "🚀 Workers: $WORKERS | Max Süre: $MAX_HOURS saat | Full: $FULL"

          if [ "$FULL" = "true" ]; then
            python main.py --full --workers "$WORKERS" --max-hours "$MAX_HOURS"
          else
            python main.py --workers "$WORKERS" --max-hours "$MAX_HOURS"
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # 5. Değişiklikleri commit & push et (Süre aşımı veya hata olsa dahi mevcut ilerlemeyi kaydeder)
      - name: 📤 Commit & Push Changes
        if: always() && steps.run_update.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Veritabanı ve checkpoint dosyalarını ekle
          git add api/
          [ -d data ] && git add data/
          [ -f errors.log ] && git add errors.log
          
          # Değişiklik varsa commit et, yoksa atla
          if git diff --staged --quiet; then
            echo "📭 Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🔄 Anime database updated [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Değişiklikler push edildi."
          fi
